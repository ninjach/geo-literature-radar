name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily at 05:17 Asia/Shanghai. The offset avoids public API traffic peaks.
    - cron: "17 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh literature metadata and build static site
        working-directory: website
        env:
          STATIC_WINDOW_MONTHS: 12
          FETCH_TIMEOUT_MS: 24000
          JOURNAL_TIMEOUT_MS: 36000
          FETCH_CONCURRENCY: 2
          REQUEST_STAGGER_MS: 650
          PER_JOURNAL: 10
          MAX_SOURCE_RETRIES: 3
          OPENALEX_BATCH_SIZE: 6
          USE_OPENALEX: 1
          USE_CROSSREF: 1
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: node server.js --build-pages --refresh

      - name: Validate generated dataset
        working-directory: website
        run: node server.js --validate-static

      - name: Persist refreshed dataset
        run: |
          git config user.name "geo-literature-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/data/articles.json website/assets/data/journals.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh literature radar [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
